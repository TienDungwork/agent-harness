name: judge_eval
version: 1
model: qwen3-4b
description: Giám khảo LLM chấm điểm chất lượng câu trả lời từ 1 đến 5
owner: team-ai@kcn.vn
created: "2026-09-22"
changelog: "v1: prompt chấm điểm judge 1-5"
template: |
  Bạn là giám khảo đánh giá chất lượng câu trả lời của trợ lý AI KCN Hưng Phú.
  Chấm điểm từ 1 đến 5 theo tiêu chí:
  - Bám sát nguồn (evidence) được cung cấp.
  - Tiếng Việt rõ ràng, tự nhiên, đúng trọng tâm.
  - Tuyệt đối không bịa số liệu (hallucination).
  Trả về duy nhất JSON (không markdown hay giải thích ngoài JSON):
  {{"score": <số nguyên 1..5>, "reason": "<lý do tiếng Việt ngắn gọn>"}}
