schema_version: "1.0.0"
id: auth.change_password
type: how_to
status: published
locale: vi
version: 1
title: "Đổi mật khẩu tài khoản"
intent: change_password
aliases:
  - "đổi mật khẩu đang dùng"
  - "cập nhật mật khẩu cá nhân"
  - "thay mật khẩu đăng nhập"
  - "đổi password tài khoản"
module: auth
tags:
  - password
  - account
  - authentication
roles:
  - authenticated_user
features:
  - none
route: null
preconditions:
  - "Người dùng đã đăng nhập và biết mật khẩu hiện tại."
  - "Menu người dùng đang hiển thị trên thanh trên cùng."
summary: "Mở Đổi mật khẩu từ menu người dùng, nhập mật khẩu hiện tại và mật khẩu mới hợp lệ rồi chọn Cập nhật mật khẩu."
steps:
  - order: 1
    say: "Trên thanh trên cùng, chọn nút đang hiển thị tên tài khoản để mở menu người dùng."
    ui:
      label: "Tên tài khoản hiện tại"
      i18n_key: null
      element_id: "user-menu-btn"
  - order: 2
    say: "Chọn Đổi mật khẩu."
    ui:
      label: "Đổi mật khẩu"
      i18n_key: "user.changePassword"
      element_id: "user-menu-password-btn"
  - order: 3
    say: "Nhập đầy đủ Mật khẩu hiện tại, Mật khẩu mới và Xác nhận mật khẩu mới."
    fields:
      - label: "Mật khẩu hiện tại"
        i18n_key: "user.currentPassword"
        required: true
      - label: "Mật khẩu mới"
        i18n_key: "user.newPassword"
        required: true
        constraints:
          - "Có ít nhất 6 ký tự."
      - label: "Xác nhận mật khẩu mới"
        i18n_key: "user.confirmNewPassword"
        required: true
        constraints:
          - "Phải trùng với Mật khẩu mới."
  - order: 4
    say: "Chọn Cập nhật mật khẩu."
    ui:
      label: "Cập nhật mật khẩu"
      i18n_key: "user.updatePassword"
      element_id: null
verify: "Hộp thoại hiển thị Đổi mật khẩu thành công!, xóa nội dung ba trường mật khẩu và tự đóng."
errors:
  - if: "Một trong ba trường mật khẩu bị bỏ trống."
    then: "Nhập đầy đủ Mật khẩu hiện tại, Mật khẩu mới và Xác nhận mật khẩu mới."
  - if: "Mật khẩu mới và Xác nhận mật khẩu mới không khớp."
    then: "Nhập lại hai trường mật khẩu mới giống nhau."
  - if: "Mật khẩu mới có ít hơn 6 ký tự."
    then: "Đặt Mật khẩu mới có ít nhất 6 ký tự."
  - if: "Hệ thống báo Mật khẩu hiện tại không đúng."
    then: "Kiểm tra và nhập lại Mật khẩu hiện tại; nếu không nhớ mật khẩu, dùng chức năng Quên mật khẩu? tại màn hình đăng nhập."
sources:
  - path: "frontend/src/components/layout/UserMenu.jsx"
    kind: component
    note: "Xác minh luồng mở form, ba field, validation, yêu cầu đổi mật khẩu, thông báo thành công và đóng hộp thoại."
  - path: "frontend/src/i18n/locales/vi/common.json"
    kind: i18n
    note: "Nguồn nhãn tiếng Việt của tab, field, nút cập nhật, validation và thông báo thành công."
  - path: "frontend/tests/e2e/auth/login-profile-workflow.spec.js"
    kind: test
    note: "TC50, TC51, TC55, TC56 và TC58 xác minh giao diện, validation và luồng đổi mật khẩu thành công."
  - path: "frontend/tests/profile/change-password.spec.js"
    kind: test
    note: "Xác minh lỗi mật khẩu hiện tại không đúng và kết quả thành công khi dữ liệu hợp lệ."
last_verified: "2026-09-16"
