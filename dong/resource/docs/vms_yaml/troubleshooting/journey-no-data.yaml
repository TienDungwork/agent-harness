  - path: "frontend/src/i18n/locales/vi/modules.json"
    kind: i18n
    note: "Định nghĩa hướng dẫn, empty state và thông báo camera chưa có tọa độ cho Face/Plate journey; luồng Face cần đối chiếu module được cấp."
