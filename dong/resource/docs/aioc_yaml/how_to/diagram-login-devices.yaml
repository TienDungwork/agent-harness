steps:
  - order: 1
    say: "Sơ đồ các bước mở trang Quản Lý Camera từ đăng nhập:\n[Truy cập https://aioc.atin.vn] ➔ [Nhập tài khoản & mật khẩu] ➔ [Nhấn Đăng nhập] ➔ [Chọn menu Cấu hình & Thiết bị] ➔ [Chọn Quản Lý Camera (URL https://aioc.atin.vn/devices)] ➔ [Hiển thị danh sách thiết bị]"
    ui:
      label: "Sơ đồ luồng mở devices"
      i18n_key: "aioc.flowDiagramLoginDevices"
      element_id: null
  - order: 2
    say: "Bước 1 (Truy cập): Mở trình duyệt web, nhập địa chỉ hệ thống https://aioc.atin.vn (hoặc vào thẳng https://aioc.atin.vn/devices)."
  - order: 3
    say: "Bước 2 (Xác thực): Điền thông tin tài khoản gồm Tên đăng nhập/Email và Mật khẩu."
  - order: 4
    say: "Bước 3 (Đăng nhập): Bấm nút 'Đăng nhập' để hệ thống kiểm tra phân quyền người dùng."
  - order: 5
    say: "Bước 4 (Điều hướng menu): Sau khi đăng nhập, tại cột điều hướng bên trái chọn nhóm 'Cấu hình & Thiết bị'."
  - order: 6
    say: "Bước 5 (Mở trang thiết bị): Chọn mục 'Quản Lý Camera' để truy cập giao diện danh sách thiết bị camera tại địa chỉ URL https://aioc.atin.vn/devices."
