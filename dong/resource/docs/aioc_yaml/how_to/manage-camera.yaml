  - "Người dùng đã đăng nhập hệ thống AIOC thành công."
summary: "Hướng dẫn truy cập menu Cấu hình & Thiết bị > Quản Lý Camera trên hệ thống AIOC tại địa chỉ URL https://aioc.atin.vn/devices."
steps:
  - order: 1
    say: "Tại giao diện chính của hệ thống AIOC (https://aioc.atin.vn), nhìn vào thanh điều hướng menu bên trái màn hình."
    ui:
      label: "Thanh điều hướng"
      i18n_key: "aioc.navigation"
      element_id: "sidebar-menu"
  - order: 2
    say: "Bấm vào nhóm menu 'Cấu hình & Thiết bị' để mở danh sách các mục quản trị hệ thống."
    ui:
      label: "Cấu hình & Thiết bị"
      i18n_key: "aioc.menuConfigDevices"
      element_id: null
  - order: 3
    say: "Bấm chọn mục 'Quản Lý Camera' để mở màn hình quản lý thiết bị camera tại địa chỉ https://aioc.atin.vn/devices."
    ui:
      label: "Quản Lý Camera"
      i18n_key: "aioc.menuCameraManagement"
      element_id: "menu-devices"
  - order: 4
    say: "Tại trang Quản Lý Camera (/devices), người dùng có thể xem danh sách toàn bộ camera, trạng thái kết nối, tìm kiếm, lọc theo khu vực, thêm camera mới hoặc cập nhật cấu hình thiết bị."
    ui:
      label: "Danh sách Camera"
      i18n_key: "aioc.cameraList"
      element_id: "devices-table"
sources:
