steps:
  - order: 1
    say: "Sơ đồ quy trình thêm camera mới trên AIOC:\n[Đăng nhập hệ thống] ➔ [Vào Quản Lý Camera https://aioc.atin.vn/devices] ➔ [Nhấn Thêm Camera] ➔ [Điền thông tin camera (Mã, Tên, Zone, RTSP luồng chính)] ➔ [Nhấn Lưu] ➔ [Hoàn thành tạo camera]"
    ui:
      label: "Sơ đồ quy trình thêm camera"
      i18n_key: "aioc.diagramAddCamera"
      element_id: null
  - order: 2
    say: "Bước 1 (Mở trang thiết bị): Truy cập menu Cấu hình & Thiết bị > Quản Lý Camera tại địa chỉ https://aioc.atin.vn/devices."
  - order: 3
    say: "Bước 2 (Mở form thêm mới): Nhấn vào nút 'Thêm Camera' ở phía trên danh sách."
  - order: 4
    say: "Bước 3 (Nhập thông tin cơ bản): Điền Mã Camera, Tên Camera, chọn Tổ chức, Cơ sở và Zone quản lý."
  - order: 5
    say: "Bước 4 (Cấu hình luồng RTSP): Nhập địa chỉ RTSP luồng chính, luồng phụ và thông tin tài khoản kết nối camera."
  - order: 6
    say: "Bước 5 (Xác nhận lưu): Nhấn nút 'Lưu' để hệ thống kiểm tra luồng và tạo mới thiết bị camera."
  - order: 7
    say: "Bước 6 (Hoàn thành): Camera mới được thêm vào hệ thống và hiển thị trên bảng danh sách camera."
