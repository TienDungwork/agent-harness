# Demo / production dong (frontend + backend). Langfuse riêng: langfuse/docker-compose.yml

name: kcn-hungphu-agent

services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: kcn_hungphu_frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    depends_on:
      ai_backend:
        condition: service_healthy
    networks:
      - kcn_network

  ai_backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kcn_hungphu_backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    env_file:
      - path: .env
        required: false
    environment:
      PORT: "8000"
      MONITORING_ENABLED: ${MONITORING_ENABLED:-false}
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
      # Langfuse stack riêng (langfuse/) — không dùng LANGFUSE_HOST từ .env (localhost)
      LANGFUSE_HOST: http://host.docker.internal:3000
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - kcn_network

networks:
  kcn_network:
    name: kcn_hungphu_network
    driver: bridge
