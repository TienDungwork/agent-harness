# Creanova Agent Canvas
#
# Image = runtime only (agent-server + automation + Node ingress).
# Local code is applied on top:
#   ./build          → UI overlay (Creanova + Hosts / SSH)
#   ./docker + ./scripts → entrypoint / static-server
#   ../services/local-gateway → auth + SSH inventory + VMS analytics API
#   ../deploy/clickhouse     → ClickHouse warehouse + vms-sync (this compose)
#   henrygd/beszel + agent     → host/container monitoring (http://localhost:18090)
#
# Full machine setup (đổi server): see setup.md
#
# First time only (full install + build inside Docker — slow):
#   docker compose --profile overlay-build run --rm canvas-ui-build
# Then:
#   docker compose up -d --build
#
# Fast UI iteration while Docker is already up (preferred):
#   # fix root-owned build/locales if a prior Docker build wrote them:
#   #   sudo chown -R "$USER:$USER" build public/locales build.staging
#   VITE_BASE_PATH=/agents VITE_LOCAL_AUTH_ENABLED=true npm run build:overlay:live
#   # or: docker compose --profile overlay-build run --rm canvas-ui-build
#   # hard-refresh http://localhost:18000/agents/  (NO restart needed — overlay
#   # uses --live-static so new hashed assets are visible immediately)
#   # Do NOT build straight into ./build while agent-canvas is up (emptyOutDir → 404).
#
# UI: http://localhost:18010/agents/
# Path gateway (agents + admin + monitoring): http://localhost:18000/
# ClickHouse HTTP (loopback): http://127.0.0.1:18123
# Local login (after overlay): admin / admin123
#
# Networking (Atin191 rule): Docker bridge MUST use 10.240.0.0/16 pools.

services:
  # ── ClickHouse VMS warehouse (+ Postgres pull via vms-sync) ─────────────
  # Config/init live under ../deploy/clickhouse; data volume is shared with the
  # legacy standalone stack (clickhouse_creanova_ch_data).
  clickhouse:
    image: clickhouse/clickhouse-server:26.8.2.7@sha256:fa394da808cc53f76d0344429421d6c422a6ee85fe7450135c0e3cff4df9bcbb
    container_name: creanova-clickhouse
    hostname: creanova-clickhouse
    restart: unless-stopped
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    env_file:
      - ../deploy/clickhouse/.env
    environment:
      CLICKHOUSE_DB: vms
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    ports:
      - "127.0.0.1:18123:8123"
      - "127.0.0.1:19000:9000"
    volumes:
      - creanova_ch_data:/var/lib/clickhouse
      - ../deploy/clickhouse/config.d/docker_related_config.xml:/etc/clickhouse-server/config.d/docker_related_config.xml:ro
      - ../deploy/clickhouse/config.d/creanova.xml:/etc/clickhouse-server/config.d/creanova.xml:ro
      - ../deploy/clickhouse/init:/docker-entrypoint-initdb.d:ro
    networks:
      - default
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8123/ping"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 20s

  vms-sync:
    build:
      context: ../services/vms-sync
      dockerfile: Dockerfile
    container_name: creanova-vms-sync
    restart: unless-stopped
    depends_on:
      clickhouse:
        condition: service_healthy
    env_file:
      - ../deploy/clickhouse/.env
    environment:
      # Passwords/PG come from env_file; map sync role password for the worker.
      CH_URL: http://creanova-clickhouse:8123
      CH_USER: vms_sync
      CH_DATABASE: vms
      POLL_SECONDS: ${POLL_SECONDS:-60}
      BATCH_SIZE: ${BATCH_SIZE:-20000}
      LAG_SECONDS: ${LAG_SECONDS:-30}
    entrypoint:
      - /bin/sh
      - -c
      - export CH_PASSWORD="$$CH_SYNC_PASSWORD"; exec /opt/venv/bin/python -u main.py
    networks:
      - default

  canvas-ui-build:
    image: node:24-slim
    profiles: ["overlay-build"]
    working_dir: /src
    volumes:
      - .:/src
      - canvas_ui_npm:/src/node_modules
    environment:
      HUSKY: "0"
      VITE_BASE_PATH: /agents
      VITE_LOCAL_AUTH_ENABLED: "true"
      VITE_LEAN_AGENT_CONTEXT: "true"
      VITE_DO_NOT_TRACK: "1"
      # Do not bake LAN IP into the overlay build — ingress proxies /api on the same origin.
      VITE_BACKEND_BASE_URL: ""
      VITE_BACKEND_HOST: ""
    # Skip npm ci when the named volume already has deps (saves ~minutes).
    # Build into build.staging then sync → ./build so a live bind-mount stays up.
    command: sh -c "if [ ! -x node_modules/.bin/vite ]; then npm ci; fi && npm run build:overlay:live"

  local-gateway:
    build:
      context: ../services/local-gateway
      dockerfile: Dockerfile
    container_name: local-gateway
    environment:
      HOST: 0.0.0.0
      PORT: "18110"
      AUTH_BACKEND: local
      LOCAL_ADMIN_PASSWORD: ${LOCAL_ADMIN_PASSWORD:-}
      AGENT_SERVER_URL: http://agent-canvas:18000
      DATABASE_URL: sqlite:////data/agent-canvas/local-gateway.db
      SESSION_SECRET: ${OH_SECRET_KEY:-change-me-creanova-local-session-secret}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://127.0.0.1:18010,http://localhost:18010,http://192.168.1.191:18010,http://192.168.1.198:18010,http://192.168.82.52:18010,http://127.0.0.1:18000,http://localhost:18000,http://192.168.1.191:18000,http://192.168.1.198:18000,http://192.168.82.52:18000,http://127.0.0.1:3001,http://localhost:3001,http://192.168.1.191:3001,http://192.168.1.198:3001,http://127.0.0.1:18090,http://localhost:18090,http://192.168.1.191:18090,http://192.168.1.198:18090}
      BESZEL_HUB_URL: http://beszel:8090
      BESZEL_USER_EMAIL: ${BESZEL_USER_EMAIL:-admin@creanova.local}
      BESZEL_USER_PASSWORD: ${BESZEL_USER_PASSWORD:-admin123}
      BESZEL_HUB_PUBLIC_URL: ${BESZEL_HUB_PUBLIC_URL:-http://192.168.1.191:18090}
      CH_URL: ${CH_URL:-http://creanova-clickhouse:8123}
      CH_USER: ${CH_USER:-vms_ro}
      CH_PASSWORD: ${CH_PASSWORD:-}
      CH_DATABASE: ${CH_DATABASE:-vms}
      VMS_ORGANIZATION_ID: ${VMS_ORGANIZATION_ID:-106}
      ANALYTICS_LLM_BASE_URL: ${ANALYTICS_LLM_BASE_URL:-http://192.168.1.196:11434/v1}
      ANALYTICS_LLM_MODEL: ${ANALYTICS_LLM_MODEL:-qwen3-16k-nothink:latest}
      ANALYTICS_LLM_API_KEY: ${ANALYTICS_LLM_API_KEY:-ollama}
    volumes:
      - ../services/local-gateway:/app
      - canvas_state:/data
      - beszel_shared:/beszel_shared:ro
    command:
      - sh
      - -c
      - |
        keyfile=/data/agent-canvas/api-key.txt
        i=0
        while [ ! -s "$$keyfile" ] && [ "$$i" -lt 60 ]; do
          sleep 1
          i=$$((i + 1))
        done
        if [ -s "$$keyfile" ]; then
          export AGENT_SERVER_API_KEY=$$(cat "$$keyfile")
        fi
        tokenfile=/data/agent-canvas/infra-agent-token.txt
        i=0
        while [ ! -s "$$tokenfile" ] && [ "$$i" -lt 60 ]; do
          sleep 1
          i=$$((i + 1))
        done
        if [ -s "$$tokenfile" ]; then
          export INFRA_AGENT_TOKEN=$$(cat "$$tokenfile")
        fi
        mkdir -p /data/agent-canvas
        exec /opt/venv/bin/python main.py
    depends_on:
      agent-canvas:
        condition: service_started
      clickhouse:
        condition: service_healthy
    networks:
      - default
    restart: unless-stopped

  agent-canvas:
    image: ${AGENT_CANVAS_IMAGE:-ntiendung/agents-harness:v1.0.0}
    container_name: agent-canvas
    ports:
      - "0.0.0.0:${CANVAS_HOST_PORT:-18010}:8000"
    environment:
      - LOCAL_BACKEND_API_KEY=${LOCAL_BACKEND_API_KEY:-}
      - OH_SECRET_KEY=${OH_SECRET_KEY:-}
      - OH_LOCAL_AUTH=${OH_LOCAL_AUTH:-1}
      - LOCAL_GATEWAY_URL=http://local-gateway:18110
      # Path gateway uses /agents (see deploy/gateway). Override to /canvas for legacy.
      - AGENT_CANVAS_BASE_PATH=${AGENT_CANVAS_BASE_PATH:-/agents}
    volumes:
      - ${PROJECTS_PATH:-${HOME}/projects}:/projects
      - /var/run/docker.sock:/var/run/docker.sock
      # Runtime image stays untouched; local code is bind-mounted over it.
      - ./docker/entrypoint.sh:/opt/agent-canvas/entrypoint.sh:ro
      - ./docker/patch_litellm_stream_options.py:/opt/agent-canvas/patch_litellm_stream_options.py:ro
      - ./docker/patch_vms_reply_vi_finish.py:/opt/agent-canvas/patch_vms_reply_vi_finish.py:ro
      - ./docker/patch_no_profile_skills.py:/opt/agent-canvas/patch_no_profile_skills.py:ro
      - ./docker/patch_lean_local_agent.py:/opt/agent-canvas/patch_lean_local_agent.py:ro
      - ./scripts/static-server.mjs:/opt/agent-canvas/static-server.mjs:ro
      - ./scripts/proxy-utils.mjs:/opt/agent-canvas/proxy-utils.mjs:ro
      - ./build:/opt/agent-canvas/frontend-overlay:ro
      # VMS / infra MCP stdio (vms_summary, …) — spawned by agent-server.
      - ../services/infra-mcp:/opt/infra-mcp:ro
      # Hub image writes state here (user=openhands). Named volume keeps
      # conversations across recreate; local-gateway shares the same data.
      - canvas_state:/home/openhands/.openhands
      # Custom identity: Hub image reads ~/.openhands/SOUL.md; Creanova SDK
      # reads ~/.Creanova/SOUL.md. Overlay UI also injects LOCAL_HARNESS.
      - ./config/SOUL.md:/home/openhands/.openhands/SOUL.md:ro
      - ./config/SOUL.md:/home/openhands/.Creanova/SOUL.md:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - default
    restart: unless-stopped
    stdin_open: true
    tty: true

  # Local SMTP catcher for Beszel alert emails (UI: http://127.0.0.1:18025).
  # Override BESZEL_SMTP_* to point at a real provider (Gmail, SMTP2GO, …).
  mailpit:
    image: axllent/mailpit:v1.21
    container_name: creanova-mailpit
    restart: unless-stopped
    ports:
      - "0.0.0.0:${MAILPIT_UI_PORT:-18025}:8025"
    expose:
      - "1025"
    networks:
      - default

  beszel:
    image: creanova/beszel:gpu-containers
    pull_policy: never
    container_name: creanova-beszel
    restart: unless-stopped
    environment:
      APP_URL: ${BESZEL_APP_URL:-http://127.0.0.1:18090}
      USER_EMAIL: ${BESZEL_USER_EMAIL:-admin@creanova.local}
      USER_PASSWORD: ${BESZEL_USER_PASSWORD:-admin123}
      # Allow Keycloak OIDC users to self-register on first login (email must match gateway).
      USER_CREATION: ${BESZEL_USER_CREATION:-true}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # Port published via beszel-ui (injects All Systems home control).
    expose:
      - "8090"
    volumes:
      - beszel_data:/beszel_data
    networks:
      - default
    depends_on:
      - mailpit
    healthcheck:
      test: ["CMD", "/beszel", "health", "--url", "http://localhost:8090"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  # Public Beszel entry (18090): proxies hub + injects Creanova branding / All Systems.
  beszel-ui:
    image: nginx:1.27-alpine
    container_name: creanova-beszel-ui
    restart: unless-stopped
    depends_on:
      beszel:
        condition: service_healthy
      local-gateway:
        condition: service_started
    ports:
      - "0.0.0.0:${BESZEL_PORT:-18090}:8090"
    volumes:
      - ./docker/beszel-ui-nginx.conf:/etc/nginx/nginx.conf:ro
      - ../services/local-gateway/beszel_branding.js:/creanova-static/creanova-beszel-home.js:ro
    networks:
      - default

  beszel-bootstrap:
    image: alpine:3.21
    container_name: creanova-beszel-bootstrap
    restart: "no"
    depends_on:
      beszel:
        condition: service_healthy
      mailpit:
        condition: service_started
    environment:
      HUB_URL: http://beszel:8090
      BESZEL_USER_EMAIL: ${BESZEL_USER_EMAIL:-admin@creanova.local}
      BESZEL_USER_PASSWORD: ${BESZEL_USER_PASSWORD:-admin123}
      BESZEL_USER_USERNAME: ${BESZEL_USER_USERNAME:-admin}
      BESZEL_AGENT_PORT: "45876"
      BESZEL_SMTP_ENABLED: ${BESZEL_SMTP_ENABLED:-true}
      BESZEL_SMTP_HOST: ${BESZEL_SMTP_HOST:-mailpit}
      BESZEL_SMTP_PORT: ${BESZEL_SMTP_PORT:-1025}
      BESZEL_SMTP_USER: ${BESZEL_SMTP_USER:-}
      BESZEL_SMTP_PASSWORD: ${BESZEL_SMTP_PASSWORD:-}
      BESZEL_SMTP_TLS: ${BESZEL_SMTP_TLS:-false}
      BESZEL_SMTP_SENDER_NAME: ${BESZEL_SMTP_SENDER_NAME:-Creanova Alerts}
      BESZEL_SMTP_SENDER_ADDRESS: ${BESZEL_SMTP_SENDER_ADDRESS:-alerts@creanova.local}
      # Off unless Keycloak compose is up (AUTH_BACKEND=keycloak).
      BESZEL_OIDC_ENABLED: ${BESZEL_OIDC_ENABLED:-false}
      KEYCLOAK_PUBLIC_URL: ${KEYCLOAK_PUBLIC_URL:-http://192.168.1.191:18180}
      KEYCLOAK_REALM: ${KEYCLOAK_REALM:-creanova}
      BESZEL_OIDC_CLIENT_ID: ${BESZEL_OIDC_CLIENT_ID:-beszel}
      BESZEL_OIDC_CLIENT_SECRET: ${BESZEL_OIDC_CLIENT_SECRET:-beszel-local-secret}
    volumes:
      - beszel_data:/beszel_data:ro
      - beszel_shared:/beszel_shared
      - canvas_state:/canvas_state:ro
      - ./docker/beszel-bootstrap.sh:/bootstrap.sh:ro
    command:
      - sh
      - -c
      - apk add --no-cache curl jq openssh-client sqlite >/dev/null && exec sh /bootstrap.sh
    networks:
      - default

  # SMART: base nvidia image includes smartctl. Agent binary is Creanova build with
  # per-container GPU % / VRAM (upstream henrygd image does not ship that collector).
  # Map disk controllers only — not partitions. Docs: https://beszel.dev/guide/smart-data
  beszel-agent:
    image: creanova/beszel-agent:gpu-containers
    pull_policy: never
    container_name: creanova-beszel-agent
    restart: unless-stopped
    network_mode: host
    # Host PID ns: required for per-container GPU % / VRAM (nvidia-smi PIDs → /proc/<pid>/cgroup)
    # and for nvidia-smi pmon SM utilization. Docs: https://beszel.dev/guide/gpu
    pid: host
    # NVIDIA: requires nvidia-container-toolkit on the host.
    gpus: all
    depends_on:
      beszel-bootstrap:
        condition: service_completed_successfully
    # Controller nodes only (not partitions). Add more hosts' disks as needed.
    devices:
      - /dev/nvme0:/dev/nvme0
    cap_add:
      - SYS_RAWIO
      - SYS_ADMIN
    volumes:
      - beszel_agent_data:/var/lib/beszel-agent
      - beszel_shared:/beszel_shared:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      LISTEN: "45876"
      HUB_URL: ${BESZEL_HUB_URL:-http://127.0.0.1:18090}
      TOKEN_FILE: /beszel_shared/token
      KEY_FILE: /beszel_shared/id_ed25519.pub
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
      # nvidia-smi: host + container GPU; nvml alone left system_stats without GPU data here
      GPU_COLLECTOR: nvidia-smi

  # Static Creanova FE for :18000/admin/ (no host Vite).
  admin-ui:
    build:
      context: ../frontend
      dockerfile: Dockerfile.admin
    image: creanova-admin:local
    container_name: creanova-admin
    restart: unless-stopped
    expose:
      - "80"
    networks:
      - default

  # One host port: /agents /admin /monitoring
  gateway:
    image: nginx:1.27-alpine
    container_name: creanova-gateway
    restart: unless-stopped
    depends_on:
      - agent-canvas
      - admin-ui
      - beszel-ui
    ports:
      - "0.0.0.0:${GATEWAY_HOST_PORT:-18000}:18000"
    volumes:
      - ../deploy/gateway/nginx.conf:/etc/nginx/nginx.conf:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - default

volumes:
  canvas_ui_npm:
  canvas_state:
    name: agent-canvas_canvas_state
  # Reuse existing warehouse volume from legacy `deploy/clickhouse` project.
  creanova_ch_data:
    name: clickhouse_creanova_ch_data
    external: true
  beszel_data:
  beszel_shared:
  beszel_agent_data:

networks:
  default:
    name: agent-canvas_net
    driver: bridge
    ipam:
      config:
        - subnet: 10.240.120.0/24
          gateway: 10.240.120.1
