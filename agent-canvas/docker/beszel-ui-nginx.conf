worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen 8090;
        server_name _;
        client_max_body_size 32m;

        location = /creanova-beszel-home.js {
            alias /creanova-static/creanova-beszel-home.js;
            default_type application/javascript;
            add_header Cache-Control "no-store";
        }

        location / {
            proxy_pass http://beszel:8090;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;

            proxy_hide_header X-Frame-Options;
            proxy_hide_header Content-Security-Policy;
            proxy_set_header Accept-Encoding "";

            sub_filter_types text/html;
            sub_filter_once on;
            sub_filter '<title>Beszel</title>' '<title>Creanova</title>';
            # Hide Beszel SVG until Creanova logo mounts; load branding as early as possible.
            sub_filter '</head>' '<style id="creanova-boot">a[aria-label="Home"]>svg:not(#creanova-logo){visibility:hidden!important;position:absolute!important;width:0!important;height:0!important;overflow:hidden!important}a[aria-label="Home"]{margin-inline-end:.25rem!important;padding-block:.25rem!important;padding-inline:0!important}</style><script src="/creanova-beszel-home.js"></script></head>';
        }
    }
}
