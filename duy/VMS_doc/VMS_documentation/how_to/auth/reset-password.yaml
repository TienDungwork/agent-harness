schema_version: "1.0.0"
id: auth.reset_password
type: how_to
status: published
locale: vi
version: 1
title: "Khôi phục mật khẩu đăng nhập"
intent: reset_password
aliases:
  - "quên mật khẩu"
  - "lấy lại mật khẩu"
  - "không nhớ mật khẩu đăng nhập"
  - "đổi mật khẩu bằng OTP"
module: auth
tags:
  - login
  - password
  - otp
roles:
  - unauthenticated_user
features:
  - none
route: "/login"
menu_path:
  - "Đăng nhập"
preconditions:
  - "Tài khoản có email hoặc tên đăng nhập hợp lệ."
  - "Người dùng có thể nhận mã OTP qua email đã đăng ký."
summary: "Tại màn hình Đăng nhập, chọn Quên mật khẩu?, yêu cầu mã OTP qua email rồi đặt mật khẩu mới."
steps:
  - order: 1
    say: "Tại màn hình Đăng nhập, chọn Quên mật khẩu?."
    ui:
      label: "Quên mật khẩu?"
      i18n_key: "login.forgotPassword"
      element_id: null
  - order: 2
    say: "Nhập Email / Tên đăng nhập của tài khoản."
    fields:
      - label: "Email / Tên đăng nhập"
        i18n_key: "generated.Login.emailTenDangNhap"
        required: true
  - order: 3
    say: "Chọn Gửi mã OTP qua Email."
    ui:
      label: "Gửi mã OTP qua Email"
      i18n_key: "generated.Login.guiMaOtpQuaEmail"
      element_id: null
  - order: 4
    say: "Nhập mã xác thực OTP 6 chữ số đã nhận."
    fields:
      - label: "Mã xác thực OTP 6 chữ số"
        i18n_key: "generated.Login.maXacThucOtp6ChuSo"
        required: true
  - order: 5
    say: "Nhập mật khẩu mới và nhập lại mật khẩu mới để xác nhận; mật khẩu phải có ít nhất 6 ký tự."
    fields:
      - label: "Mật khẩu mới"
        i18n_key: "user.newPassword"
        required: true
        constraints:
          - "Tối thiểu 6 ký tự."
      - label: "Xác nhận mật khẩu mới"
        i18n_key: "generated.Login.xacNhanMatKhauMoi"
        required: true
        constraints:
          - "Phải trùng với mật khẩu mới."
  - order: 6
    say: "Chọn Cập nhật mật khẩu, sau đó đăng nhập bằng mật khẩu mới."
    ui:
      label: "Cập nhật mật khẩu"
      i18n_key: "generated.Login.capNhatMatKhau"
      element_id: null
verify: "Hệ thống thông báo đổi mật khẩu thành công và yêu cầu đăng nhập bằng mật khẩu mới."
errors:
  - if: "Không nhận được hoặc không gửi được OTP."
    then: "Kiểm tra lại email/tên đăng nhập; nếu vẫn lỗi, liên hệ quản trị viên."
  - if: "Mật khẩu xác nhận không khớp."
    then: "Nhập lại hai trường mật khẩu giống nhau."
related:
  - auth.login
sources:
  - path: "frontend/src/pages/Login/Login.jsx"
    kind: component
    note: "Triển khai modal hai bước: gửi OTP, xác nhận OTP và cập nhật mật khẩu."
  - path: "frontend/src/i18n/locales/vi/common.json"
    kind: i18n
    note: "Nhãn đăng nhập, quên mật khẩu, mật khẩu mới và thông báo thành công."
last_verified: "2026-09-16"
