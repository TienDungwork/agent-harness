summary: "Nhóm Dịch Vụ hiển thị động các module AI khả dụng cho tổ chức; danh sách module và tab có thể khác giữa các tài khoản hoặc tổ chức."
answer: >-
  Nhóm Dịch Vụ không chứa một danh sách module cố định. Thanh bên nạp danh sách
  module AI từ hệ thống, chỉ giữ module đang hoạt động, được bật cho tổ chức và
  không phải nhóm phân loại, rồi tạo mục điều hướng cho từng module. Vì thế không
  có cơ sở để khẳng định một module cụ thể được bật cho mọi người dùng. Tên module
  ưu tiên khóa i18n modules.<CODE>.label, sau đó mới dùng tên do hệ thống trả về
  hoặc mã module. Khi mở module, trang chọn bộ tab theo mã module; nhãn tab dùng
  các khóa modules.tabs.*. Những tab nằm trong disabled_features của module bị
  ẩn, và tab không hợp lệ hoặc đã bị tắt được chuyển sang tab khả dụng đầu tiên.
  Một số module có route chuyên biệt, nên hãy mở từ mục đang hiển thị trong thanh
  bên thay vì tự suy đoán đường dẫn. Việc một module xuất hiện cũng không tự chứng
  minh mọi tab đã kết nối dữ liệu thật: giao diện INTRUSION và BEHAVIOR hiện có
  phần dữ liệu mô phỏng, còn một số tab cấu hình FIRE, ZONE hoặc CROWD là legacy
  hoặc không được menu hiện hành expose. Chatbot chỉ hướng dẫn các card published
  đã xác minh, không suy ra thao tác từ tên module. Nếu nhóm Dịch Vụ không có
  module cần tìm, hãy kiểm tra với quản trị viên tổ chức về module và feature đã
  được cấp.
