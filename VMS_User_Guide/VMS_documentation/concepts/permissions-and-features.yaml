route: null
preconditions:
  - "Người dùng đã đăng nhập vào VMS."
summary: "Menu VMS được tạo theo tổ chức, feature, quyền của tài khoản và các module AI khả dụng, nên hai người dùng có thể thấy các mục khác nhau."
answer: >-
  Thanh bên của VMS không phải danh sách cố định. Các mục chung chỉ xuất hiện khi
  feature tương ứng của tổ chức đang bật; một số mục quản trị và tổ chức còn được
  lọc theo vai trò hoặc capability của tài khoản. Module AI là danh sách động từ
  dữ liệu hệ thống và chỉ hiển thị module đang hoạt động, được bật cho tổ chức và
  không phải nhóm phân loại. Vì vậy không thể coi mọi module là được bật cho mọi
  người dùng. Với những route có RequireFeature, feature bị tắt sẽ không render
  nội dung và hệ thống chuyển sang route phù hợp khác hoặc trang từ chối truy cập.
  Không phải mọi route đều dùng guard này, nên việc không thấy menu trước hết cần
  đối chiếu feature, quyền, loại tổ chức và module được cấp thay vì kết luận hệ
  thống lỗi. Nếu cần thêm quyền hoặc module, hãy liên hệ quản trị viên tổ chức.
