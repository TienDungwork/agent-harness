[project]
name = "Creanova-workspace"
version = "1.36.1"
description = "Creanova Workspace - Docker and container-based workspace implementations"

requires-python = ">=3.12"
dependencies = [
    "Creanova-sdk",
    "Creanova-agent-server",
    "pydantic>=2.11.7",
]

[project.urls]
Source = "https://github.com/Creanova/software-agent-sdk"
Homepage = "https://github.com/Creanova/software-agent-sdk"
Documentation = "https://docs.Creanova.dev/sdk"
"Bug Tracker" = "https://github.com/Creanova/software-agent-sdk/issues"

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-dir]
"" = "."

[tool.setuptools.packages.find]
include = ["Creanova.workspace*"]
namespaces = true

[tool.setuptools.package-data]
"*" = ["py.typed"]
