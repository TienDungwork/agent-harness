[build-system]
build-backend = "setuptools.build_meta"

requires = [ "setuptools>=61" ]

[project]
name = "creanova-local-gateway"
version = "0.1.0"
description = "Local auth gateway: Keycloak login + per-user session for agent-canvas"
requires-python = ">=3.12"
classifiers = [
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = [
  "alembic>=1.14",
  "asyncssh>=2.17",
  "cryptography>=43",
  "fastapi>=0.115",
  "httpx>=0.27",
  "itsdangerous>=2.2",
  "psycopg[binary]>=3.2",
  "pydantic>=2",
  "pydantic-settings>=2",
  "python-jose[cryptography]>=3.3",
  "sqlalchemy>=2",
  "uvicorn[standard]>=0.32",
]

[tool.setuptools.packages.find]
include = [ "auth*", "routers*", "storage*", "proxy*", "infra*" ]
