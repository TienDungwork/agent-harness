# Creanova path gateway — one host port → /agents /admin /monitoring
#
# Prefer one-up from agent-canvas/:
#   cd agent-canvas && docker compose up -d
#
# Standalone (canvas stack already up):
#   docker compose -f deploy/gateway/docker-compose.yml up -d --build
#   open http://<LAN-IP>:18000/
#
# Atin191 / network.md: Docker bridge MUST use 10.240.0.0/16 (never 192.168.x).
# Network: creanova_gateway_net → 10.240.125.0/24
# Also joins external agent-canvas_net to reach agent-canvas + beszel-ui + admin.

services:
  admin-ui:
    build:
      context: ../../frontend
      dockerfile: Dockerfile.admin
    image: creanova-admin:local
    container_name: creanova-admin
    restart: unless-stopped
    expose:
      - "80"
    networks:
      - agent-canvas_net

  gateway:
    image: nginx:1.27-alpine
    container_name: creanova-gateway
    restart: unless-stopped
    depends_on:
      - admin-ui
    ports:
      - "0.0.0.0:${GATEWAY_HOST_PORT:-18000}:18000"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - gateway_net
      - agent-canvas_net

networks:
  gateway_net:
    name: creanova_gateway_net
    driver: bridge
    ipam:
      config:
        - subnet: 10.240.125.0/24
          gateway: 10.240.125.1
  agent-canvas_net:
    external: true
    name: agent-canvas_net
