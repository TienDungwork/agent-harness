worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 64m;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Shared /api and sockets: route by cookie set when entering each app path.
    # Fallback: Referer, then agents (canvas).
    map $cookie_gateway_app $api_upstream {
        admin      http://agent-canvas:8000;
        monitoring http://creanova-beszel-ui:8090;
        agents     http://agent-canvas:8000;
        default    http://agent-canvas:8000;
    }

    map $http_referer $api_upstream_referer {
        default                             http://agent-canvas:8000;
        ~*(localhost|127\.0\.0\.1|192\.168\.[0-9.]+):[0-9]+/admin  http://agent-canvas:8000;
        ~*/admin(?:/|$|\?)                  http://agent-canvas:8000;
        ~*(localhost|127\.0\.0\.1|192\.168\.[0-9.]+):[0-9]+/monitoring  http://creanova-beszel-ui:8090;
        ~*/monitoring(?:/|$|\?)             http://creanova-beszel-ui:8090;
    }

    map $api_upstream $api_backend {
        default $api_upstream;
        ""      $api_upstream_referer;
    }

    server {
        listen 18000;
        server_name _;

        # Landing
        location = / {
            default_type text/html;
            return 200 '<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"/><title>Creanova Gateway</title><style>body{font-family:system-ui,sans-serif;max-width:40rem;margin:3rem auto;padding:0 1rem;line-height:1.5}a{display:block;margin:.5rem 0;font-size:1.1rem}</style></head><body><h1>Creanova Gateway</h1><p>Single entry — pick a function:</p><a href="/agents/">/agents/ — Agents (Agent Canvas)</a><a href="/admin/">/admin/ — Admin (usage / org)</a><a href="/monitoring/">/monitoring/ — Monitoring (Beszel)</a></body></html>';
        }

        location = /agents {
            return 301 /agents/;
        }

        location /agents/ {
            proxy_pass http://agent-canvas:8000/agents/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Prefix /agents;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            add_header Set-Cookie "gateway_app=agents; Path=/; SameSite=Lax" always;
        }

        # Back-compat while overlays still bake /canvas
        location /canvas/ {
            proxy_pass http://agent-canvas:8000/canvas/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            add_header Set-Cookie "gateway_app=agents; Path=/; SameSite=Lax" always;
        }

        location = /admin {
            return 301 /admin/;
        }

        location /admin/ {
            # Strip /admin prefix — Creanova Vite base=/admin/ still requests
            # assets under /admin/; with base configured, upstream sees /admin/*.
            # When FE runs with --base /admin/, proxy without stripping:
            proxy_pass http://host.docker.internal:12000/admin/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Prefix /admin;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            add_header Set-Cookie "gateway_app=admin; Path=/; SameSite=Lax" always;
        }

        location = /monitoring {
            return 301 /monitoring/;
        }

        location /monitoring/ {
            # Strip prefix: Beszel UI is root-mounted on :18090
            proxy_pass http://creanova-beszel-ui:8090/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Prefix /monitoring;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_redirect / /monitoring/;
            proxy_cookie_path / /monitoring/;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            add_header Set-Cookie "gateway_app=monitoring; Path=/; SameSite=Lax" always;
        }

        # Agent-server probe paths (Canvas default backend = this gateway origin)
        location = /server_info {
            proxy_pass http://agent-canvas:8000/server_info;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location = /health {
            proxy_pass http://agent-canvas:8000/health;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        location = /alive {
            proxy_pass http://agent-canvas:8000/alive;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        # Shared API / realtime — cookie + Referer select upstream
        location /api/ {
            proxy_pass $api_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        location /sockets {
            proxy_pass $api_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        location /socket.io/ {
            proxy_pass $api_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # PocketBase / Beszel absolute asset paths when cookie=monitoring
        location /_/ {
            proxy_pass http://creanova-beszel-ui:8090/_/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /static/ {
            proxy_pass http://creanova-beszel-ui:8090/static/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Beszel Vite assets + branding (absolute paths from hub HTML)
        location /assets/ {
            proxy_pass http://creanova-beszel-ui:8090/assets/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location = /creanova-beszel-home.js {
            proxy_pass http://creanova-beszel-ui:8090/creanova-beszel-home.js;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        location /creanova-api/ {
            proxy_pass http://creanova-beszel-ui:8090/creanova-api/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 90s;
        }
    }
}
