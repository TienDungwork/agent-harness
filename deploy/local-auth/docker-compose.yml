# Local Keycloak for Creanova multi-user auth (optional).
# DEFAULT auth does NOT need Docker — use AUTH_BACKEND=local on the gateway.
#
# Atin191 networking rule: pin bridges to 10.240.0.0/16 (never 192.168.x Docker defaults).
# Network: 10.240.122.0/24
#
# Boot (only if AUTH_BACKEND=keycloak):
#   docker compose -f deploy/local-auth/docker-compose.yml up -d
# Admin UI: http://127.0.0.1:18180  (admin / admin)
# Realm: creanova

services:
  keycloak-db:
    image: postgres:16-alpine
    container_name: creanova-keycloak-db
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: keycloak
    volumes:
      - keycloak_pg_data:/var/lib/postgresql/data
    networks:
      - local_auth_net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 5s
      timeout: 5s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: creanova-keycloak
    command:
      - start-dev
      - --import-realm
      - --http-port=8080
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak
      KC_HEALTH_ENABLED: "true"
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_HOSTNAME_STRICT: "false"
      KC_HTTP_ENABLED: "true"
    ports:
      - "0.0.0.0:18180:8080"
    volumes:
      - ./realm-creanova.json:/opt/keycloak/data/import/realm-creanova.json:ro
    depends_on:
      keycloak-db:
        condition: service_healthy
    networks:
      - local_auth_net
    restart: unless-stopped

volumes:
  keycloak_pg_data:

networks:
  local_auth_net:
    name: creanova_local_auth_net
    driver: bridge
    ipam:
      config:
        - subnet: 10.240.122.0/24
          gateway: 10.240.122.1
