# Vendored checkouts keep their own lint/format configs.
exclude: ^(agent-canvas/|software-agent-sdk/)

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        exclude: ^(docs/|modules/|python/|enterprise/)
      - id: end-of-file-fixer
        exclude: ^(docs/|modules/|python/|enterprise/)
      - id: check-yaml
        args: ["--allow-multiple-documents"]
      - id: debug-statements


  - repo: local
    hooks:
      - id: warn-appmode-oss
        name: "Warn on AppMode.OSS in backend (use AppMode.Creanova)"
        language: system
        entry: bash -lc 'if rg -n "\\bAppMode\\.OSS\\b" Creanova tests/unit; then echo "Found AppMode.OSS usage. Prefer AppMode.Creanova."; exit 1; fi'
        pass_filenames: false

  - repo: https://github.com/tox-dev/pyproject-fmt
    rev: v2.5.1
    hooks:
      - id: pyproject-fmt
        args: [--keep-full-version]
  - repo: https://github.com/abravalheri/validate-pyproject
    rev: v0.24.1
    hooks:
      - id: validate-pyproject

  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Ruff version.
    rev: v0.12.5
    hooks:
      # Run the linter. Config is auto-discovered from pyproject.toml.
      - id: ruff
        types_or: [python, pyi, jupyter]
        args: [--fix, --unsafe-fixes]
        exclude: ^(enterprise/)
      # Run the formatter. Config is auto-discovered from pyproject.toml.
      - id: ruff-format
        types_or: [python, pyi, jupyter]
        exclude: ^(enterprise/)

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.15.0
    hooks:
      - id: mypy
        additional_dependencies:
          [
            types-requests,
            types-setuptools,
            types-pyyaml,
            types-toml,
            types-docker,
            types-Markdown,
            pydantic,
            lxml,
            "sqlalchemy>=2.0",
          ]
        # To see gaps add `--html-report mypy-report/`
        # Vendored SDK is not on PyPI; point mypy at the local packages.
        entry: env PYTHONPATH=software-agent-sdk/Creanova-sdk:software-agent-sdk/Creanova-tools:software-agent-sdk/Creanova-workspace:software-agent-sdk/Creanova-agent-server mypy --config-file dev_config/python/mypy.ini Creanova/
        always_run: true
        pass_filenames: false
